name: Verify and Build XGram APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional release tag, for example v1.2.0'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Test, lint, and build installable APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/XGram-v1.2.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XGram-v1.2.0-debug-apk
          path: release-assets/XGram-v1.2.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish requested GitHub release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: XGram ${{ github.event.inputs.version }}
          body: |
            Installable debug APK built from the tested source on this tag.

            Verification: unit startup tests, Android lint, APK assembly, and debug signing.
          files: release-assets/XGram-v1.2.0-debug.apk
          draft: false
          prerelease: false
